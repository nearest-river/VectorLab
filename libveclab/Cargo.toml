[package]
name = "libveclab"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
console_error_panic_hook = "0.1.7"
console_log = { version = "1.1.0", features = ["color", "wasm-bindgen"] }
wasm-bindgen = { version = "0.2.129", features = ["serde", "serde-serialize", "serde_json", "strict-macro"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
js-sys = "0.3"
regex = "1.13.1"
once_cell = "1.21.4"
log = { version = "0.4.34", features = ["max_level_debug", "release_max_level_warn"] }
serde-wasm-bindgen = "0.6.5"



